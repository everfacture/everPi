<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="dim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
  </g>

  <!-- Terminal-style card -->
  <rect x="120" y="80" width="1040" height="240" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal header -->
  <rect x="120" y="80" width="1040" height="32" rx="8" fill="#161b22"/>
  <rect x="120" y="104" width="1040" height="8" fill="#161b22"/>
  <circle cx="148" cy="96" r="5" fill="#f85149"/>
  <circle cx="166" cy="96" r="5" fill="#d29922"/>
  <circle cx="184" cy="96" r="5" fill="#3fb950"/>
  <text x="640" y="99" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">everPi — engineering-principles</text>

  <!-- Terminal content -->
  <text x="160" y="152" fill="#8b949e" font-family="monospace" font-size="14">
    <tspan fill="#3fb950">✓</tspan> skill loaded: engineering-principles
  </text>
  <text x="160" y="182" fill="#8b949e" font-family="monospace" font-size="13">  GEAR:     BUILD</text>
  <text x="160" y="206" fill="#8b949e" font-family="monospace" font-size="13">  RADIUS:   moderate</text>
  <text x="160" y="230" fill="#8b949e" font-family="monospace" font-size="13">  VERIFY:   tsc --noEmit</text>
  <text x="160" y="254" fill="#8b949e" font-family="monospace" font-size="13">  ASSUME:   user wants BUILD mode</text>
  <text x="160" y="278" fill="#8b949e" font-family="monospace" font-size="13">  <tspan fill="#38bdf8">→ read before touch. ship small bombs. verify or label.</tspan></text>

  <!-- Title -->
  <text x="640" y="56" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="1">
    everPi
  </text>

  <!-- Corner accent -->
  <rect x="120" y="140" width="4" height="150" fill="url(#accent)" rx="2"/>

  <!-- Bottom tagline -->
  <text x="640" y="370" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" letter-spacing="0.5">
    Engineering-grade skills for Pi coding agent
  </text>
</svg>
